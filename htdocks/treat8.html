        <h2>ホワイトニングとは？</h2>
        <p>ホワイトニングとは、専用の薬剤を使って歯の内部の色素を分解し、歯を白くする方法です。<br>
        加齢や食生活などによって黄ばんでしまった歯を、自然な白さに導きます。<br>
        歯を削ることなく、笑顔の印象を明るくすることができます。</p>
