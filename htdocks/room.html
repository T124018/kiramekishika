<body>
    <main>
      <div class="room-introduce">
        <img src="../images/kids-IMG_3501.jpg" alt="キッズルーム" width="95%">
        <h2>キッズスペース</h2>
        <p>当院では広々としたキッズスペースを設置しております。
          お待ちいただく時間も楽しくお過ごしいただけます。</p>
      </div>
      <div class="room-introduce">
        <img src="../images/individual-image.jpg" alt="全室個室診療">
        <h2>全室個室診療</h2>
        <p>当院では患者様のプラーバシーの観点から全室個室診療を採用しております。
          リラックスして治療を受けていただけます。
        </p>
      </div>
      <div class="room-introduce">
        <img src="../images/baliafree-image.jpg" alt="バリアフリー">
        <h2>バリアフリー</h2>
        <p>当院では全面バリアフリーとなっております。
          エントランスはスロープ、自動ドア、そして段差を排除し、
          院内土足とすることでベビーカーから車椅子までそのまま診療室まで行くことができます。</p>
      </div>
      <div class="room-introduce">
        <img src="../images/babyroom-image.jpg" alt="授乳室">
        <h2>授乳室</h2>
        <p>授乳室を設置しております。もちろんおむつ交換台も設置しております。</p>
      </div>
        
    </main>
